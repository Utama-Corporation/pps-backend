<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 80mm;
        font-family: Arial, sans-serif;
        font-size: 9pt;
        background: white;
      }

      .label {
        width: 80mm;
        padding: 3mm 4mm;
        display: flex;
        gap: 3mm;
        align-items: flex-start;
      }

      /* ── Kiri: QR ── */
      .label-qr {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .label-qr img {
        width: 26mm;
        height: 26mm;
      }

      /* ── Kanan: info ── */
      .label-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.8mm;
      }

      .jenis {
        font-size: 9pt;
        font-weight: bold;
        padding-bottom: 1.5mm;
        border-bottom: 1px solid #000;
        margin-bottom: 1mm;
        display: block;
        position: relative;
        height: 8.2mm;
      }

      .watermark {
        position: absolute;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        font-size: 14pt;
        font-weight: 900;
        color: rgba(0, 0, 0, 0.3);
        letter-spacing: 2px;
        white-space: nowrap;
        z-index: 0;
      }

      .jenis-text {
        position: relative;
        z-index: 1;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        line-height: 3.6mm;
      }

      .label-info .row {
        font-size: 9pt;
        color: #222;
        word-break: break-all;
      }

      .label-info .label-code {
        font-size: 18pt;
        font-weight: bold;
        color: #000;
        margin-top: 1mm;
      }
    </style>
  </head>
  <body>
    <div class="label">
      <!-- Kiri: QR code -->
      <div class="label-qr">
        <img src="{{qrBase64}}" alt="QR" />
      </div>

      <!-- Kanan: info -->
      <div class="label-info">
        <span class="jenis">
          <span class="jenis-text">{{namaProduk}}</span>
          <span class="watermark">{{watermarkText}}</span>
        </span>
        <div class="row">{{kode}}</div>
        <div class="row">By&nbsp;&nbsp;&nbsp;: {{createBy}}</div>
        <div class="label-code">{{tanggal}}</div>
      </div>
    </div>
  </body>
</html>
